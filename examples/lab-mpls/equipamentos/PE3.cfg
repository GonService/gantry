! PE3 — roteador de borda (PE): VRFs dos clientes e MP-BGP com os P
! Digitado no console no primeiro boot (sem NVRAM) e salvo com write memory.
!
hostname PE3
no ip domain-lookup
ip cef
vrf definition CLIENTE-A
 rd 65000:100
 address-family ipv4
  route-target export 65000:100
  route-target import 65000:100
  route-target import 65000:999
 exit-address-family
vrf definition CLIENTE-B
 rd 65000:200
 address-family ipv4
  route-target export 65000:200
  route-target import 65000:200
  route-target import 65000:999
 exit-address-family
vrf definition GERENCIA
 rd 65000:999
 address-family ipv4
  route-target export 65000:999
  route-target import 65000:999
  route-target import 65000:100
  route-target import 65000:200
 exit-address-family
mpls label protocol ldp
mpls ldp router-id Loopback0 force
interface Loopback0
 ip address 10.255.0.13 255.255.255.255
interface Ethernet0/0
 description P1
 ip address 10.0.31.1 255.255.255.252
 mpls ip
 no shutdown
interface Ethernet0/1
 description P2
 ip address 10.0.32.1 255.255.255.252
 mpls ip
 no shutdown
interface Ethernet0/2
 description CE-A3
 vrf forwarding CLIENTE-A
 ip address 10.1.3.1 255.255.255.252
 no shutdown
interface Ethernet0/3
 description CE-B2
 vrf forwarding CLIENTE-B
 ip address 10.2.3.1 255.255.255.252
 no shutdown
interface Ethernet1/1
 description NOC (VRF GERENCIA)
 vrf forwarding GERENCIA
 ip address 10.9.0.1 255.255.255.252
 no shutdown
interface Ethernet1/0
 description NOC (tabela global)
 ip address 10.0.90.1 255.255.255.252
 no shutdown
router ospf 1
 router-id 10.255.0.13
 passive-interface Loopback0
 network 10.0.0.0 0.0.255.255 area 0
 network 10.255.0.0 0.0.0.255 area 0
router bgp 65000
 bgp router-id 10.255.0.13
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.255.0.1 remote-as 65000
 neighbor 10.255.0.1 update-source Loopback0
 neighbor 10.255.0.2 remote-as 65000
 neighbor 10.255.0.2 update-source Loopback0
 address-family vpnv4
  neighbor 10.255.0.1 activate
  neighbor 10.255.0.1 send-community extended
  neighbor 10.255.0.2 activate
  neighbor 10.255.0.2 send-community extended
 exit-address-family
 address-family ipv4 vrf CLIENTE-A
  neighbor 10.1.3.2 remote-as 65103
  neighbor 10.1.3.2 activate
 exit-address-family
 address-family ipv4 vrf CLIENTE-B
  neighbor 10.2.3.2 remote-as 65202
  neighbor 10.2.3.2 activate
 exit-address-family
 address-family ipv4 vrf GERENCIA
  neighbor 10.9.0.2 remote-as 65999
  neighbor 10.9.0.2 activate
 exit-address-family
username admin privilege 15 secret admin
line vty 0 4
 login local
 transport input telnet
snmp-server community public RO
snmp-server ifindex persist
snmp-server location Lab MPLS
line con 0
 logging synchronous
 exec-timeout 0 0
