! SW-A3 — switch L2 do site: portas na VLAN 10, IP só para gerência
! Digitado no console no primeiro boot (sem NVRAM) e salvo com write memory.
!
hostname SW-A3
no ip domain-lookup
vlan 10
 name CLIENTES
exit
interface Ethernet0/0
 description CE-A3
 switchport mode access
 switchport access vlan 10
 no shutdown
interface Ethernet0/1
 description cli-a3
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
interface Ethernet0/2
 description cli-a3b
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
interface Vlan10
 description GERENCIA do switch
 ip address 172.16.3.2 255.255.255.0
 no shutdown
ip default-gateway 172.16.3.1
ip route 0.0.0.0 0.0.0.0 172.16.3.1
username admin privilege 15 secret admin
line vty 0 4
 login local
 transport input telnet
snmp-server community public RO
snmp-server ifindex persist
snmp-server location Lab MPLS
line con 0
 logging synchronous
 exec-timeout 0 0
