! PE2 — roteador de borda (PE): VRFs dos clientes e MP-BGP com os P
! Digitado no console no primeiro boot (sem NVRAM) e salvo com write memory.
!
hostname PE2
no ip domain-lookup
ip cef
vrf definition CLIENTE-A
 rd 65000:100
 address-family ipv4
  route-target export 65000:100
  route-target import 65000:100
  route-target import 65000:999
 exit-address-family
mpls label protocol ldp
mpls ldp router-id Loopback0 force
interface Loopback0
 ip address 10.255.0.12 255.255.255.255
interface Ethernet0/0
 description P1
 ip address 10.0.21.1 255.255.255.252
 mpls ip
 no shutdown
interface Ethernet0/1
 description P2
 ip address 10.0.22.1 255.255.255.252
 mpls ip
 no shutdown
interface Ethernet0/2
 description CE-A2
 vrf forwarding CLIENTE-A
 ip address 10.1.2.1 255.255.255.252
 no shutdown
router ospf 1
 router-id 10.255.0.12
 passive-interface Loopback0
 network 10.0.0.0 0.0.255.255 area 0
 network 10.255.0.0 0.0.0.255 area 0
router bgp 65000
 bgp router-id 10.255.0.12
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.255.0.1 remote-as 65000
 neighbor 10.255.0.1 update-source Loopback0
 neighbor 10.255.0.2 remote-as 65000
 neighbor 10.255.0.2 update-source Loopback0
 address-family vpnv4
  neighbor 10.255.0.1 activate
  neighbor 10.255.0.1 send-community extended
  neighbor 10.255.0.2 activate
  neighbor 10.255.0.2 send-community extended
 exit-address-family
 address-family ipv4 vrf CLIENTE-A
  neighbor 10.1.2.2 remote-as 65102
  neighbor 10.1.2.2 activate
 exit-address-family
username admin privilege 15 secret admin
line vty 0 4
 login local
 transport input telnet
snmp-server community public RO
snmp-server ifindex persist
snmp-server location Lab MPLS
line con 0
 logging synchronous
 exec-timeout 0 0
