! P1 — roteador do núcleo (P): OSPF, LDP e refletor de rotas VPNv4
! Digitado no console no primeiro boot (sem NVRAM) e salvo com write memory.
!
hostname P1
no ip domain-lookup
ip cef
mpls label protocol ldp
mpls ldp router-id Loopback0 force
interface Loopback0
 ip address 10.255.0.1 255.255.255.255
interface Ethernet0/0
 description P2
 ip address 10.0.100.1 255.255.255.252
 mpls ip
 no shutdown
interface Ethernet0/1
 description PE1
 ip address 10.0.11.2 255.255.255.252
 mpls ip
 no shutdown
interface Ethernet0/2
 description PE2
 ip address 10.0.21.2 255.255.255.252
 mpls ip
 no shutdown
interface Ethernet0/3
 description PE3
 ip address 10.0.31.2 255.255.255.252
 mpls ip
 no shutdown
router ospf 1
 router-id 10.255.0.1
 passive-interface Loopback0
 network 10.0.0.0 0.0.255.255 area 0
 network 10.255.0.0 0.0.0.255 area 0
router bgp 65000
 bgp router-id 10.255.0.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor PE peer-group
 neighbor PE remote-as 65000
 neighbor PE update-source Loopback0
 neighbor 10.255.0.11 peer-group PE
 neighbor 10.255.0.12 peer-group PE
 neighbor 10.255.0.13 peer-group PE
 address-family vpnv4
  neighbor PE send-community extended
  neighbor PE route-reflector-client
  neighbor 10.255.0.11 activate
  neighbor 10.255.0.12 activate
  neighbor 10.255.0.13 activate
 exit-address-family
username admin privilege 15 secret admin
line vty 0 4
 login local
 transport input telnet
snmp-server community public RO
snmp-server ifindex persist
snmp-server location Lab MPLS
line con 0
 logging synchronous
 exec-timeout 0 0
