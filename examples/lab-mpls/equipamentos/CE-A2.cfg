! CE-A2 — roteador do cliente (CE): eBGP com o PE, anuncia a LAN do site
! Digitado no console no primeiro boot (sem NVRAM) e salvo com write memory.
!
hostname CE-A2
no ip domain-lookup
ip cef
interface Loopback0
 ip address 10.255.1.2 255.255.255.255
interface Ethernet0/0
 description PE2
 ip address 10.1.2.2 255.255.255.252
 no shutdown
interface Ethernet0/1
 description LAN site A2 (SW-A2)
 ip address 172.16.2.1 255.255.255.0
 no shutdown
router bgp 65102
 bgp router-id 10.255.1.2
 bgp log-neighbor-changes
 neighbor 10.1.2.1 remote-as 65000
 network 172.16.2.0 mask 255.255.255.0
 network 10.255.1.2 mask 255.255.255.255
username admin privilege 15 secret admin
line vty 0 4
 login local
 transport input telnet
snmp-server community public RO
snmp-server ifindex persist
snmp-server location Lab MPLS
line con 0
 logging synchronous
 exec-timeout 0 0
