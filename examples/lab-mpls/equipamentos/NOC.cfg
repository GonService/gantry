! NOC — roteador do NOC: liga a LAN do monitoramento à rede (global e VRF GERENCIA)
! Digitado no console no primeiro boot (sem NVRAM) e salvo com write memory.
!
hostname NOC
no ip domain-lookup
ip cef
interface Loopback0
 ip address 10.255.0.100 255.255.255.255
interface Ethernet0/0
 description PE3 (tabela global: P e PE)
 ip address 10.0.90.2 255.255.255.252
 no shutdown
interface Ethernet0/1
 description PE3 (VRF GERENCIA: CEs e switches)
 ip address 10.9.0.2 255.255.255.252
 no shutdown
interface Ethernet0/2
 description LAN do NOC (Prometheus)
 ip address 10.250.0.1 255.255.255.0
 no shutdown
router ospf 1
 router-id 10.255.0.100
 passive-interface Loopback0
 passive-interface Ethernet0/2
 network 10.0.90.0 0.0.0.3 area 0
 network 10.255.0.100 0.0.0.0 area 0
 network 10.250.0.0 0.0.0.255 area 0
router bgp 65999
 bgp router-id 10.255.0.100
 bgp log-neighbor-changes
 neighbor 10.9.0.1 remote-as 65000
 network 10.250.0.0 mask 255.255.255.0
username admin privilege 15 secret admin
line vty 0 4
 login local
 transport input telnet
snmp-server community public RO
snmp-server ifindex persist
snmp-server location Lab MPLS
line con 0
 logging synchronous
 exec-timeout 0 0
