      indexes: *id001
      lookups: *id002
    - name: ifHCInOctets
      oid: 1.3.6.1.2.1.31.1.1.1.6
      type: counter
      indexes: *id001
      lookups: *id002
    - name: ifHCInUcastPkts
      oid: 1.3.6.1.2.1.31.1.1.1.7
      type: counter
      indexes: *id001
      lookups: *id002
    - name: ifHCOutOctets
      oid: 1.3.6.1.2.1.31.1.1.1.10
      type: counter
      indexes: *id001
      lookups: *id002
    - name: ifHCOutUcastPkts
      oid: 1.3.6.1.2.1.31.1.1.1.11
      type: counter
      indexes: *id001
      lookups: *id002
    - name: ifHighSpeed
      oid: 1.3.6.1.2.1.31.1.1.1.15
