# Configuração do snmp_exporter. O módulo "lab" diz quais OIDs coletar:
# interfaces (IF-MIB), CPU (CISCO-PROCESS-MIB; nos switches L2, OLD-CISCO-CPU-MIB),
# memória (CISCO-MEMORY-POOL-MIB), BGP (BGP4-MIB), OSPF (OSPF-MIB), tabela de
# rotas (IP-FORWARD-MIB), LDP (MPLS-LDP-STD-MIB) e rotas por VRF (MPLS-VPN-MIB).
# Mudou este arquivo? Reinicie o serviço snmp-exporter.
auths:
  public_v2:
    community: public
    version: 2
modules:
  lab:
    walk:
    - 1.3.6.1.2.1.1.3
    - 1.3.6.1.2.1.2.2.1.7
    - 1.3.6.1.2.1.2.2.1.8
    - 1.3.6.1.2.1.2.2.1.13
    - 1.3.6.1.2.1.2.2.1.14
    - 1.3.6.1.2.1.2.2.1.19
    - 1.3.6.1.2.1.2.2.1.20
    - 1.3.6.1.2.1.31.1.1.1.1
    - 1.3.6.1.2.1.31.1.1.1.6
    - 1.3.6.1.2.1.31.1.1.1.7
    - 1.3.6.1.2.1.31.1.1.1.10
    - 1.3.6.1.2.1.31.1.1.1.11
    - 1.3.6.1.2.1.31.1.1.1.15
    - 1.3.6.1.2.1.31.1.1.1.18
    - 1.3.6.1.4.1.9.9.109.1.1.1.1
    - 1.3.6.1.4.1.9.9.48.1.1.1
    - 1.3.6.1.4.1.9.2.1.56
    - 1.3.6.1.4.1.9.2.1.57
    - 1.3.6.1.4.1.9.2.1.58
    - 1.3.6.1.4.1.9.2.1.8
    - 1.3.6.1.2.1.15.3.1
    - 1.3.6.1.2.1.14.10.1
    - 1.3.6.1.2.1.4.24.3
    - 1.3.6.1.2.1.4.24.4.1
    - 1.3.6.1.2.1.10.166.4.1.3.3.1.2
    - 1.3.6.1.3.118.1.2.2.1.7
    - 1.3.6.1.3.118.1.3.1.1
    metrics:
    - name: sysUpTime
      oid: 1.3.6.1.2.1.1.3
      type: gauge
      help: Tempo ligado (centésimos de segundo)
    - name: ifAdminStatus
      oid: 1.3.6.1.2.1.2.2.1.7
      type: gauge
      indexes: &id001
      - labelname: ifIndex
        type: gauge
      lookups: &id002
      - labels:
        - ifIndex
        labelname: ifName
        oid: 1.3.6.1.2.1.31.1.1.1.1
        type: DisplayString
      - labels:
        - ifIndex
        labelname: ifAlias
        oid: 1.3.6.1.2.1.31.1.1.1.18
        type: DisplayString
    - name: ifOperStatus
      oid: 1.3.6.1.2.1.2.2.1.8
      type: gauge
      indexes: *id001
      lookups: *id002
    - name: ifInDiscards
      oid: 1.3.6.1.2.1.2.2.1.13
      type: counter
      indexes: *id001
      lookups: *id002
    - name: ifInErrors
      oid: 1.3.6.1.2.1.2.2.1.14
      type: counter
      indexes: *id001
      lookups: *id002
    - name: ifOutDiscards
      oid: 1.3.6.1.2.1.2.2.1.19
