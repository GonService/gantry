# nginx na frente do Grafana (porta 3000 do host): /terminal/ vai para o
# terminal web (ttyd do container ferramentas), o resto para o Grafana.
# Assim os links "Terminal" da Topologia funcionam de qualquer máquina.
# (A imagem do nginx troca ${NGINX_LOCAL_RESOLVERS} pelo DNS do container.)
map $http_upgrade $conn {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;

  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $conn;
  proxy_set_header Host $http_host;
  proxy_read_timeout 1d;

  location /terminal/ {
    set $terminal http://prometheus:7681;
    proxy_pass $terminal;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
  }
}
