# nome: n8n
# categoria: Ferramentas
# descrição: Automação de fluxos.
services:
  n8n:
    image: docker.io/n8nio/n8n:1.64.0
    restart: unless-stopped
    environment:
      GENERIC_TIMEZONE: ${TZ:-America/Sao_Paulo}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "${PORTA:-5678}:5678"
    volumes:
      - dados:/home/node/.n8n
volumes:
  dados: {}
