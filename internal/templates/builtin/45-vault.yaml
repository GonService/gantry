# nome: Vault (modo dev)
# categoria: Segurança
# descrição: HashiCorp Vault em modo de desenvolvimento, com o token raiz que você escolher. Os dados ficam só na memória.
services:
  vault:
    image: docker.io/hashicorp/vault:1.17
    restart: unless-stopped
    command: server -dev -dev-listen-address=0.0.0.0:8200
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:?token raiz para entrar na interface}
    ports:
      - "${PORTA:-8200}:8200"
