# nome: Gitea
# categoria: Ferramentas
# descrição: Servidor git com interface web.
services:
  gitea:
    image: docker.io/gitea/gitea:1.22
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
    ports:
      - "${PORTA_WEB:-3002}:3000"
      - "${PORTA_SSH:-2222}:22"
    volumes:
      - dados:/data
volumes:
  dados: {}
