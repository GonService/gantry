# nome: WordPress + MariaDB
# categoria: Web
# descrição: WordPress com o banco numa rede interna; a instalação termina no navegador.
services:
  wordpress:
    image: wordpress:6-apache
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_SENHA:?senha do banco}
      WORDPRESS_DB_NAME: wordpress
    ports:
      - "${PORTA:-8086}:80"
    volumes:
      - site:/var/www/html
    depends_on: [db]
    networks: [interna]
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_SENHA:?senha do banco}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - banco:/var/lib/mysql
    networks: [interna]
volumes:
  site: {}
  banco: {}
networks:
  interna: {}
