# nome: Keycloak + Postgres
# categoria: Segurança
# descrição: Keycloak (login, SSO, OIDC) em modo de desenvolvimento, guardando tudo num Postgres.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    restart: unless-stopped
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${ADMIN_SENHA:?senha do admin do Keycloak}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${DB_SENHA:-keycloak}
    ports:
      - "${PORTA:-8180}:8080"
    depends_on: [db]
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${DB_SENHA:-keycloak}
    volumes:
      - dados:/var/lib/postgresql/data
volumes:
  dados: {}
