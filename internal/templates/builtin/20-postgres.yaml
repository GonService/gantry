# nome: Postgres
# categoria: Bancos de dados
# descrição: PostgreSQL com os dados num volume.
services:
  db:
    image: postgres:${VERSAO_PG:-16}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina a senha do banco}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "${PORTA:-5432}:5432"
    volumes:
      - dados:/var/lib/postgresql/data
volumes:
  dados: {}
